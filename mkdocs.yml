site_name: Portfolio – Tomasz Bis aka Aldarar - Data Science
site_url: https://aldarar.github.io/Portfolio/

theme:
  name: material
  language: pl
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Strona główna: index.md
  - Projekty:
    - Analiza Iris: projekty/iris/index.md

markdown_extensions:
  - attr_list      # pozwala pisać { .md-button } w markdownie
  - admonition     # ramki typu !!! note

extra_javascript:
  - javascripts/iframe-resize.js
